<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent {{ equipment.name }}</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; padding: 40px; display: flex; justify-content: center; }
        .checkout-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
        h2 { color: #2c3e50; margin-top: 0; }
        .price { font-size: 18px; color: #666; margin-bottom: 20px; }
        .total-box { background: #e8f8f5; border-radius: 8px; padding: 15px; margin: 20px 0; text-align: center; border: 1px solid #a3e4d7; }
        .total-price { font-size: 28px; color: #27ae60; font-weight: bold; margin-top: 5px; }
        label { font-weight: 600; color: #333; }
        input { width: 100%; padding: 12px; margin: 10px 0 0 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .btn-confirm { background-color: #2980b9; color: white; border: none; padding: 14px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-confirm:hover { background-color: #1f6391; }
        .cancel { display: block; text-align: center; margin-top: 15px; color: #7f8c8d; text-decoration: none; font-size: 14px; }
        .cancel:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="checkout-card">
        <h2>Rent {{ equipment.name }}</h2>
        <p>Category: {{ equipment.category }}<br>
        Owner: {{ equipment.owner.username }}</p>
        
        <div class="price">Rate: <b>₹{{ equipment.price_per_day }}</b> / day</div>

        <form method="POST">
            {% csrf_token %}
            <label>How many days do you need it?</label>
            <input type="number" name="days" id="days-input" min="1" value="1" required>
            
            <!-- Live Total Display Box -->
            <div class="total-box">
                <div style="font-size: 14px; color: #555; text-transform: uppercase; letter-spacing: 1px;">Total Cost</div>
                <div class="total-price" id="total-display">₹{{ equipment.price_per_day }}</div>
            </div>

            <button type="submit" class="btn-confirm">Confirm Booking</button>
        </form>
        <a href="/" class="cancel">Cancel and return to map</a>
    </div>

    <!-- JavaScript for Live Calculation -->
    <script>
        // Get the daily price from Django
        const pricePerDay = parseFloat("{{ equipment.price_per_day }}");
        
        // Grab the input box and the total display element
        const daysInput = document.getElementById('days-input');
        const totalDisplay = document.getElementById('total-display');

        // Listen for any changes (typing or clicking the up/down arrows)
        daysInput.addEventListener('input', function() {
            // Get the current number of days, default to 0 if empty
            let days = parseInt(this.value) || 0;
            
            // Calculate the total
            let total = days * pricePerDay;
            
            // Update the text on the screen
            totalDisplay.textContent = '₹' + total.toFixed(2);
        });
    </script>
</body>
</html>

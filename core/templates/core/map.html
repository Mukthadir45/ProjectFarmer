<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f0f2f5; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: #1c2833; margin: 0; }
        .dashboard-link { text-decoration: none; background: #2980b9; color: white; padding: 10px 15px; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        .dashboard-link:hover { background: #1f6391; }
        #map { height: 700px; width: 100%; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="header">
        <h2>Nearby Farm Equipment</h2>
        <a href="/dashboard/" class="dashboard-link">Go to Dashboard →</a>
    </div>
    
    <div id="map"></div>

    <!-- Safely inject Django data into JavaScript -->
    {{ equipments|json_script:"equipment-data" }}
    {{ hotspots|json_script:"hotspot-data" }}

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // Center the map over the Nandyal region
        var map = L.map('map').setView([15.48, 78.48], 11);
        
        // Use reliable Esri map tiles to bypass ad-blockers and tracking errors
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles © Esri'
        }).addTo(map);

        // Load the equipment data
        var equipments = JSON.parse(document.getElementById('equipment-data').textContent);
        
        // Loop through equipment data and place interactive markers
        equipments.forEach(function(eq) {
            var popupContent = `
                <div style="text-align:center; min-width: 150px;">
                    <b style="font-size: 16px; color: #2c3e50;">${eq.name}</b><br>
                    <span style="color: #666;">Type: ${eq.category}</span><br>
                    <div style="margin: 10px 0; font-size: 14px; font-weight: bold; color: #27ae60;">₹${eq.price_per_day} / day</div>
                    <a href="/rent/${eq.id}/" style="background:#27ae60; color:white; padding:8px; text-decoration:none; border-radius:4px; display:block; font-weight:bold;">Rent Now</a>
                </div>
            `;
            L.marker([eq.latitude, eq.longitude]).addTo(map).bindPopup(popupContent);
        });

        // Load the hotspot data generated by Scikit-learn KMeans
        var hotspots = JSON.parse(document.getElementById('hotspot-data').textContent);
        
        // Draw a red circle over each high-demand regional cluster
        hotspots.forEach(function(spot) {
            L.circle([spot.lat, spot.lng], {
                color: 'red',
                fillColor: '#f03',
                fillOpacity: 0.2,
                radius: 4000 // 4km radius
            }).addTo(map).bindPopup("<b>High Demand Hotspot</b><br>Move equipment here for faster rentals.");
        });
    </script>
</body>
</html>
